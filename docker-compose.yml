services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_db}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Loi: Bien moi truong POSTGRES_PASSWORD bat buoc phai duoc thiet lap trong file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_db}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Loi: Bien moi truong POSTGRES_PASSWORD bat buoc phai duoc thiet lap trong file .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farm_user}:${POSTGRES_PASSWORD:?Loi: Bien moi truong POSTGRES_PASSWORD bat buoc}@db:5432/${POSTGRES_DB:-farm_db}
      SECRET_KEY: ${SECRET_KEY:?Loi: Bien moi truong SECRET_KEY bat buoc phai duoc thiet lap trong file .env}
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEMO_ROLE_SWITCH: ${ENABLE_DEMO_ROLE_SWITCH:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8000"
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
