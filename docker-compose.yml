services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_db}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_a_local_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farm_user}:${POSTGRES_PASSWORD:-replace_with_a_local_secret}@db:5432/${POSTGRES_DB:-farm_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
