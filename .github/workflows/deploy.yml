name: Deploy Staging Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install ruff pytest

      - name: Run Ruff Linter
        working-directory: backend
        run: ruff check .

      - name: Run Pytest
        working-directory: backend
        run: pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-to-vps:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS with health check and rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/staging-deploy

            COMPOSE="docker-compose.staging.yml"

            # Dong bo file docker-compose.staging.yml moi nhat tu repo ve VPS
            curl -fsSL https://raw.githubusercontent.com/vanthai02032006/truy-xuat-nguon-goc/main/docker-compose.staging.yml -o "$COMPOSE"

            # Mo firewall port 80 tren VPS neu co ufw
            sudo ufw allow 80/tcp || true

            # Dang nhap GHCR de keo image
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            # Lay tag cua phien ban dang chay
            OLD_IMAGE="$(docker inspect app_staging \
              --format '{{.Config.Image}}')"
            OLD_TAG="${OLD_IMAGE##*:}"

            echo "Old tag: $OLD_TAG"
            echo "New tag: $NEW_TAG"

            # Keo image moi do pipeline build
            export IMAGE_TAG="$NEW_TAG"
            docker compose -f "$COMPOSE" pull web

            # Deploy va cho container healthy
            if docker compose -f "$COMPOSE" \
              up -d --wait --wait-timeout 120 web; then

              echo "Deploy thanh cong: $NEW_TAG"
              docker logout ghcr.io

            else
              echo "=========================================================="
              echo "DEPLOY THAT BAI! TRUY XUAT LOG DOCKER DE XAC DINH NGUYEN NHAN:"
              echo "=========================================================="
              docker compose -f "$COMPOSE" logs --tail 200 web || true
              docker inspect app_staging --format 'Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}, Error: {{.State.Error}}' || true
              echo "=========================================================="
              echo "Deploy that bai. Dang rollback ve $OLD_TAG"

              # Khoi phuc image cu
              export IMAGE_TAG="$OLD_TAG"

              if docker compose -f "$COMPOSE" \
                up -d --wait --wait-timeout 120 web; then
                echo "Rollback thanh cong: $OLD_TAG"
              else
                echo "CANH BAO: rollback that bai!"
              fi

              docker logout ghcr.io || true
              exit 1
            fi
